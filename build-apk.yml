name: Build Android APK

# Runs automatically whenever you push the zip (or any change) to the repo,
# and can also be triggered manually from the Actions tab.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          if [ -f saifoods-complete.zip ]; then
            unzip -o saifoods-complete.zip -d .
          else
            echo "saifoods-complete.zip not found in repo root — make sure it was uploaded there."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install Capacitor CLI + Android platform
        working-directory: frontend
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap sync android || npx cap add android

      - name: Build APK with Gradle
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: saifoods-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
